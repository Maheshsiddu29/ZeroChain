[package]
name = "slashing-circuit"
version = "0.1.0"
edition = "2021"
description = "Slashing circuit for validator equivocation detection"
publish = false

[dependencies]
# Halo2 ZK Framework
halo2_proofs = { workspace = true }
halo2curves = { workspace = true }

# Field arithmetic
ff = { workspace = true }

# Arkworks (for helper functions)
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
ark-serialize = { workspace = true }

# Serialization
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Random (for tests)
rand = { workspace = true }

# Utilities
anyhow = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = ["std"]
std = ["serde", "serde_json"]
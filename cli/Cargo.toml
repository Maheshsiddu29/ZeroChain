[package]
name = "zerochain-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for ZeroChain privacy operations"
license = "Apache-2.0"

[dependencies]
# CLI
structopt = "0.3"
clap = "3.0"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
hex = "0.4"

# RPC
subxt = "0.32"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
colored = "2.0"
indicatif = "0.17"

[dev-dependencies]
tokio-test = "0.4"
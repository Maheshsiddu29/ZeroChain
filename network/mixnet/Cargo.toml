[package]
name = "network-mixnet"
version = "0.1.0"
edition = "2021"
description = "Mixnet for ZeroChain with Sphinx packets and onion encryption"
license = "Apache-2.0"
publish = false

[dependencies]
# Cryptography
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
blake2 = "0.10"
hkdf = "0.12"

# Serialization (ALL optional for no_std)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Random
rand = "0.8"

# Logging
log = "0.4"

# Codec for Substrate compatibility
codec = { package = "parity-scale-codec", version = "3.6", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = ["std"]
std = [
    "serde",
    "serde_json",
]
[package]
name = "network-mixnet"
version = "0.1.0"
edition = "2021"
description = "Mixnet for ZeroChain with Sphinx packets and onion encryption"
license = "Apache-2.0"
publish = false

[dependencies]
# Cryptography
chacha20poly1305 = "0.10"
x25519-dalek = "2.0"
sha2 = "0.10"
blake2 = "0.10"
hkdf = "0.12"

# Serialization (as required, not optional)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Codec for Substrate compatibility
codec = { package = "parity-scale-codec", version = "3.6", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Random
rand = "0.8"

# Logging
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
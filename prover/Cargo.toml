[package]
name = "zerochain-prover"
version = "0.1.0"
edition = "2021"
description = "ZK Prover for Groth16, Halo2, and ZK-ORIGIN proofs"

[dependencies]
# Arkworks
ark-ff = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-ec = "0.4"

# Hashing
sha2 = "0.10"
blake2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
rand = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Circuit crates
circuits-transfer = { path = "../circuits/transfer" }
circuits-membership = { path = "../circuits/membership" }
circuits-origin = { path = "../circuits/origin" }
slashing-circuit = { path = "../circuits/slashing" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "zerochain-prover"
path = "src/main.rs"
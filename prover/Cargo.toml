[package]
name = "zerochain-prover"
version = "0.1.0"
edition = "2021"
description = "ZK Prover for Groth16, Halo2, and ZK-ORIGIN proofs"

[dependencies]
# Arkworks
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
ark-snark = { workspace = true }

# Hashing
sha2 = { workspace = true }
blake2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
rand = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }  # ADD THIS

# CLI
structopt = "0.3"

# Circuit crates
transfer-circuit = { path = "../circuits/transfer" }
membership-circuit = { path = "../circuits/membership" }
origin-circuit = { path = "../circuits/origin" }
slashing-circuit = { path = "../circuits/slashing" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3.8"  # ADD THIS for tests

[[bin]]
name = "zerochain-prover"
path = "src/main.rs"